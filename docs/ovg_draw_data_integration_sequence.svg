<svg viewBox="0 0 680 744" width="100%" role="img">
  <title>跨引擎消费 ovg_draw_data_t 集成时序图</title>
  <desc>引擎每帧喂输入并调用 vgui_update/vgui_draw，vgui 录制 OVG 命令后通过 get_draw_list 返回 ovg_draw_data_t，引擎遍历 gcmd_t 自建本机管线消费。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="26" font-family="sans-serif" font-size="15" font-weight="500" fill="#f0f0f5">跨引擎消费 ovg_draw_data_t · 集成时序图</text>

  <g font-family="sans-serif" font-size="13" font-weight="500">
    <g>
      <rect x="40" y="44" width="120" height="40" rx="8" fill="#23232f" stroke="#4d4d5e" stroke-width="0.5"/>
      <text x="100" y="64" text-anchor="middle" dominant-baseline="central" fill="#e8e8f0">游戏引擎主循环</text>
    </g>
    <g>
      <rect x="160" y="44" width="120" height="40" rx="8" fill="#23232f" stroke="#4d4d5e" stroke-width="0.5"/>
      <text x="220" y="64" text-anchor="middle" dominant-baseline="central" fill="#e8e8f0">vgui 核心</text>
    </g>
    <g>
      <rect x="280" y="44" width="120" height="40" rx="8" fill="#23232f" stroke="#4d4d5e" stroke-width="0.5"/>
      <text x="340" y="64" text-anchor="middle" dominant-baseline="central" fill="#e8e8f0">OVG 录制</text>
    </g>
    <g>
      <rect x="400" y="44" width="120" height="40" rx="8" fill="#23232f" stroke="#4d4d5e" stroke-width="0.5"/>
      <text x="460" y="64" text-anchor="middle" dominant-baseline="central" fill="#e8e8f0">ovg_draw_data_t</text>
    </g>
    <g>
      <rect x="520" y="44" width="120" height="40" rx="8" fill="#23232f" stroke="#4d4d5e" stroke-width="0.5"/>
      <text x="580" y="64" text-anchor="middle" dominant-baseline="central" fill="#e8e8f0">引擎渲染器</text>
    </g>
  </g>

  <g stroke="#555" stroke-width="0.5" stroke-dasharray="4 4">
    <line x1="100" y1="86" x2="100" y2="600"/>
    <line x1="220" y1="86" x2="220" y2="600"/>
    <line x1="340" y1="86" x2="340" y2="600"/>
    <line x1="460" y1="86" x2="460" y2="600"/>
    <line x1="580" y1="86" x2="580" y2="600"/>
  </g>

  <rect x="216" y="210" width="8" height="90" fill="#378ADD" opacity="0.3"/>
  <rect x="336" y="255" width="8" height="45" fill="#1D9E75" opacity="0.3"/>

  <g font-family="sans-serif" font-size="12" fill="#d8d8e0" stroke="none">
    <line x1="100" y1="120" x2="220" y2="120" stroke="#8aa0b8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="160" y="113" text-anchor="middle">① 喂输入 vgui_input_*</text>

    <line x1="100" y1="165" x2="220" y2="165" stroke="#8aa0b8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="160" y="158" text-anchor="middle">② vgui_update(ctx,dt) 布局/动画</text>

    <line x1="100" y1="210" x2="220" y2="210" stroke="#8aa0b8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="160" y="203" text-anchor="middle">③ vgui_draw(ctx,cb,vg) 录制绘制</text>

    <line x1="220" y1="255" x2="340" y2="255" stroke="#8aa0b8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="280" y="248" text-anchor="middle">④ emit gcmd_t：路径/填充/文字/裁剪</text>

    <line x1="340" y1="300" x2="220" y2="300" stroke="#8fd0a8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="280" y="293" text-anchor="middle">⑤ 录制完成 ovg_recording_t</text>

    <line x1="220" y1="345" x2="100" y2="345" stroke="#8fd0a8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="160" y="338" text-anchor="middle">⑥ get_draw_list(vg) → ovg_draw_data_t</text>

    <line x1="100" y1="395" x2="460" y2="395" stroke="#8aa0b8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="280" y="388" text-anchor="middle">⑦ 读取 gcmd_t[] 按渲染顺序</text>

    <line x1="100" y1="440" x2="580" y2="440" stroke="#8aa0b8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="340" y="433" text-anchor="middle">⑧ 遍历 gcmd_t → 建本机管线·上传顶点</text>

    <line x1="580" y1="490" x2="606" y2="490" stroke="#8aa0b8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="600" y="483" text-anchor="end">⑨ 提交 swapchain·合成于引擎 3D 之上</text>

    <line x1="100" y1="540" x2="126" y2="540" stroke="#8aa0b8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="132" y="535" text-anchor="start">⑩ 呈现 / 下一帧</text>
  </g>

  <rect x="40" y="600" width="600" height="124" rx="10" fill="#1b1b28" stroke="#3a3a4a" stroke-width="0.5"/>
  <text x="52" y="622" font-family="sans-serif" font-size="13" font-weight="500" fill="#9fe1cb">约束与变体</text>
  <g font-family="sans-serif" font-size="12" fill="#c9c9d6">
    <text x="52" y="644">· SDL3 GPU 引擎：acquire → 3D pass →（blit/合成）→ UI pass →</text>
    <text x="52" y="660">  单次 vgpu_render_frame()；勿拆多次提交（共享顶点缓冲/渲染目标竞态）。</text>
    <text x="52" y="676">· 非 SDL3 引擎：vgui_draw 后取 get_draw_list(vg) 的 gcmd_t 列表，</text>
    <text x="52" y="692">  参考 backends/vgui_renderer_sdl3.cpp 自建管线消费。</text>
    <text x="52" y="708">· 时间源可注入 vgui_context_set_time_fn；CORE_ONLY 可无窗口/无 SDL 嵌入。</text>
  </g>
</svg>
